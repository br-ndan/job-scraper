name: Job Scraper

on:
  schedule:
    # Runs every day at 13:00 UTC (adjust to your timezone preference).
    # Cron format: minute hour day month day-of-week
    - cron: "0 12,14,16,18,20,22,0 * * 1-5"
  workflow_dispatch: {}  # lets you manually trigger a run from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit updated postings.csv back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -v --no-cache-dir -r requirements.txt
        env:
          PYTHONUNBUFFERED: "1"

      - name: Run scraper
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_GMAIL_USER: ${{ secrets.SMTP_GMAIL_USER }}
          SMTP_GMAIL_PASS: ${{ secrets.SMTP_GMAIL_PASS }}
          NOTIFY_GMAIL_EMAIL: ${{ secrets.NOTIFY_GMAIL_EMAIL }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
        run: python scraper.py

      - name: Commit updated postings log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/postings.csv
          git diff --quiet --cached || git commit -m "Update job postings log [automated]"
          git push
